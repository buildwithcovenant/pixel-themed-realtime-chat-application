<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <title>Document</title>
</head>
<body>
    <div class="authentication-page">
        <div class="left-panel">
            <h2>Pixel Chat</h2>
            <p>Press start, stay connected</p>
            <h1>Little squares. Real conversations</h1>
            <img src="../assets/images/pixel-image.png" alt="Pixel pets">
            <p>A cozy corner of the internet for your favourite people</p>
            <p>No high scores, just good conversations.</p>
        </div>
        <div class="right-panel">
            <h2>Choose A New Password</h2>
            <p>Make it strong, keep your account yours.</p>
            <form action="">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <div class="password-input">
                        <input type="password" id="new-password" required>
                        <i class="fa-regular fa-eye-slash"></i>
                    </div>
                </div>
                <div class="password-strength-checker">
                    <div class="password-strength-bar">

                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <div class="password-input">
                        <input type="password" id="confirm-password" required>
                        <i class="fa-regular fa-eye-slash"></i>
                    </div>
                </div>
                <button class="submit-btn">Update Password <i class="fa-solid fa-arrow-right"></i></button>
                <button class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to login</button>

            </form>
        </div>
    </div>
</body>
</html>
