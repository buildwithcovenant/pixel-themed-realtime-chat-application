<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <title>Document</title>
</head>
<body>
    <div class="authentication-page">
        <div class="left-panel">
            <h2>Pixel Chat</h2>
            <p>Press start, stay connected</p>
            <h1>Little squares. Real conversations</h1>
            <img src="../assets/images/pixel-image.png" alt="Pixel pets">
            <p>A cozy corner of the internet for your favourite people</p>
            <p>No high scores, just good conversations.</p>
        </div>
        <div class="right-panel">
            <h1>Forgot Password?</h1>
            <p>No worries. We'll send you a reset link</p>
            <form action="">
                <div class="form-group">
                    <label for="email-address">Email address</label>
                    <input type="email" name="" id="email-address">
                </div>
                <button class="submit-btn">Send reset link <i class="fa-solid fa-arrow-right"></i></button>
                <button class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to login</button>
            </form>
            
        </div>
    </div>
</body>
</html>
