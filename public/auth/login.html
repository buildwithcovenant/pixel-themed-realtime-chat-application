<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <title>Document</title>
</head>
<body>
    <div class="authentication-page">
        <div class="left-panel">
            <h2>Pixel Chat</h2>
            <p>Press start, stay connected</p>
            <h1>Little squares. Real conversations</h1>
            <img src="../assets/images/pixel-image.png" alt="Pixel pets">
            <p>A cozy corner of the internet for your favourite people</p>
            <p>No high scores, just good conversations.</p>
        </div>
        <div class="right-panel">
            <h1>Hey, welcome back</h1>
            <p>Your people are just a pixel away</p>
            <form action="">
                <div class="form-group">
                    <label for="email-address">Email address</label>
                    <input type="email" id="email-address" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input">
                        <input type="password" id="password" required>
                        <i class="fa-regular fa-eye-slash"></i>
                    </div>
                </div>
                <div class="form-actions">
                    <div class="remember-me">
                        <input type="checkbox" name="" id="remember-me">
                        <p>Remember me</p>
                    </div>
                    <a href="forgot-password.html">Forgot Password?</a>
                </div>
                <button class="submit-btn">
                    Log in 
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
                <p class="auth-navigate">New around here? <a href="signup.html">Create an account</a></p>
            </form>
            
        </div>
    </div>
</body>
</html>
